<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" fill="none">
  <!-- Arrmada mark — vector match of arrmada-logo.png -->
  <rect width="1024" height="1024" fill="#000000"/>
  <rect x="70" y="70" width="884" height="884" rx="163" fill="#0B0B11"/>

  <!-- Left bookshelf (cream), rounded on the outer left only -->
  <path
    fill="#F6EDDB"
    d="M498 155
       H210
       C171.3 155 140 186.3 140 225
       V797
       C140 835.7 171.3 867 210 867
       H498
       Z"
  />
  <!-- Shelf well -->
  <rect x="183" y="199" width="287" height="626" rx="10" fill="#0B0B11"/>
  <!-- Shelf divider -->
  <rect x="183" y="490" width="287" height="26" fill="#F6EDDB"/>

  <!-- Top spines: teal, blue, cream, amber -->
  <rect x="196" y="238" width="58" height="249" rx="3" fill="#4EA298"/>
  <rect x="263" y="238" width="58" height="249" rx="3" fill="#618FB8"/>
  <rect x="331" y="238" width="58" height="249" rx="3" fill="#EFDFBD"/>
  <rect x="399" y="238" width="58" height="249" rx="3" fill="#F3A11C"/>

  <!-- Bottom spines: amber, cream, blue, teal -->
  <rect x="196" y="555" width="58" height="256" rx="3" fill="#F3A11C"/>
  <rect x="261" y="555" width="58" height="256" rx="3" fill="#EFDFBD"/>
  <rect x="326" y="555" width="58" height="256" rx="3" fill="#618FB8"/>
  <rect x="391" y="555" width="60" height="256" rx="3" fill="#4EA298"/>

  <!-- Right TV, rounded on the outer right only -->
  <path
    fill="#4D5F73"
    d="M498 155
       H812
       C850.7 155 882 186.3 882 225
       V797
       C882 835.7 850.7 867 812 867
       H498
       Z"
  />
  <!-- Screen -->
  <rect x="528" y="250" width="300" height="420" rx="28" fill="#1B1E26"/>

  <!-- Dials with short thick slots (TL → BR) -->
  <circle cx="558" cy="756" r="40" fill="#F3A92F"/>
  <rect
    x="-18" y="-5" width="36" height="10" rx="5"
    fill="#5C3408"
    transform="translate(558 756) rotate(45)"
  />
  <circle cx="654" cy="756" r="40" fill="#F3A92F"/>
  <rect
    x="-18" y="-5" width="36" height="10" rx="5"
    fill="#5C3408"
    transform="translate(654 756) rotate(45)"
  />

  <!-- Speaker grille — 5 bars -->
  <rect x="724" y="710" width="110" height="12" rx="4" fill="#489D94"/>
  <rect x="724" y="726" width="110" height="12" rx="4" fill="#489D94"/>
  <rect x="724" y="748" width="110" height="12" rx="4" fill="#489D94"/>
  <rect x="724" y="770" width="110" height="12" rx="4" fill="#489D94"/>
  <rect x="724" y="792" width="110" height="12" rx="4" fill="#489D94"/>

  <!-- Film reel -->
  <circle cx="516" cy="494" r="155" fill="#F5ECD8"/>
  <circle cx="516" cy="404" r="41" fill="#101317"/>
  <circle cx="601.6" cy="466.2" r="41" fill="#101317"/>
  <circle cx="568.9" cy="566.8" r="41" fill="#101317"/>
  <circle cx="463.1" cy="566.8" r="41" fill="#101317"/>
  <circle cx="430.4" cy="466.2" r="41" fill="#101317"/>
  <circle cx="516" cy="494" r="17" fill="#101317"/>
</svg>
