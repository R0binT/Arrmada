name: Build & Release APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 1.0.1) - optional, uses package.json if not provided'
        required: false
      release_tag:
        description: 'Release tag to update (e.g., v1.0.1)'
        required: false

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    name: Build APK locally
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Get version from package.json
        id: get_version
        run: |
          if [ -z "${{ github.event.inputs.version }}" ]; then
            VERSION=$(grep '"version"' package.json | head -1 | sed -E 's/.*"version": "([^"]+)".*/\1/')
          else
            VERSION="${{ github.event.inputs.version }}"
          fi
          RELEASE_TAG="v${VERSION}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "release_tag=$RELEASE_TAG" >> $GITHUB_OUTPUT
          echo "✅ Version: $VERSION"
          echo "✅ Release tag: $RELEASE_TAG"

      - name: Install dependencies
        run: npm ci

      - name: Install Expo CLI
        run: npm install -g expo-cli

      - name: Generate Android app
        run: |
          npx expo prebuild --platform android --clean

      - name: Build APK with Gradle
        working-directory: ./android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease

      - name: Find APK
        id: find_apk
        run: |
          APK_PATH=$(find ./android -name "*.apk" -type f | grep -i release | head -1)
          if [ -z "$APK_PATH" ]; then
            echo "❌ No APK found!"
            exit 1
          fi
          APK_NAME="Arrmada-${{ steps.get_version.outputs.version }}.apk"
          cp "$APK_PATH" "$APK_NAME"
          echo "apk_path=$APK_NAME" >> $GITHUB_OUTPUT
          echo "✅ Found APK: $APK_NAME"

      - name: Delete old APK asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_TAG="${{ steps.get_version.outputs.release_tag }}"
          # Check if release exists
          if ! gh release view "$RELEASE_TAG" &>/dev/null; then
            echo "ℹ️ Release $RELEASE_TAG does not exist yet"
            exit 0
          fi
          # Find and delete APK assets by name
          gh release view "$RELEASE_TAG" --json assets -q '.assets[] | select(.name | endswith(".apk")) | .name' | while read -r asset_name; do
            if [ -n "$asset_name" ]; then
              gh release delete-asset "$RELEASE_TAG" "$asset_name" || echo "⚠️ Could not delete $asset_name (may not exist)"
            fi
          done
          echo "✅ Old APK assets cleaned up"

      - name: Upload APK to Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_TAG="${{ steps.get_version.outputs.release_tag }}"
          APK_PATH="${{ steps.find_apk.outputs.apk_path }}"
          
          # Check if release exists, create if not
          if ! gh release view "$RELEASE_TAG" &>/dev/null; then
            echo "📝 Creating new release $RELEASE_TAG"
            gh release create "$RELEASE_TAG" --title "Arrmada ${{ steps.get_version.outputs.version }}" --draft
          fi
          
          gh release upload "$RELEASE_TAG" "$APK_PATH" --clobber
          echo "✅ Uploaded APK to release $RELEASE_TAG"

      - name: Success notification
        run: |
          echo "✅ APK successfully built!"
          echo "📦 Version: ${{ steps.get_version.outputs.version }}"
          echo "🏷️ Release tag: ${{ steps.get_version.outputs.release_tag }}"
          echo "📱 APK: ${{ steps.find_apk.outputs.apk_path }}"
