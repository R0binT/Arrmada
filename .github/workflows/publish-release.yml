name: Publish release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to build and upload (e.g. v1.2.0)"
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        description: "Git tag to build and upload (e.g. v1.2.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: publish-release-${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    name: Build APK and attach to GitHub Release
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      # Metro-inlined at bundle time (same name as local .env).
      EXPO_PUBLIC_TMDB_API_KEY: ${{ secrets.EXPO_PUBLIC_TMDB_API_KEY }}
    steps:
      - name: Resolve release tag
        id: tag
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            TAG="${{ inputs.tag }}"
          fi
          if [ -z "${TAG}" ]; then
            echo "::error::Missing release tag."
            exit 1
          fi
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "Resolved tag ${TAG}"

      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - name: Resolve version from release tag
        id: version
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          # Accept v1.2.0 and legacy arrmada-v1.2.0
          if [[ "${TAG}" =~ ([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            VERSION="${BASH_REMATCH[1]}"
          else
            echo "::error::Cannot parse semver from tag '${TAG}'."
            exit 1
          fi
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "${PKG_VERSION}" != "${VERSION}" ]; then
            echo "::error::Tag version ${VERSION} does not match package.json ${PKG_VERSION}."
            exit 1
          fi
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "✅ Version ${VERSION}"

      - name: Check TMDB API key secret
        run: |
          set -euo pipefail
          if [ -z "${EXPO_PUBLIC_TMDB_API_KEY:-}" ]; then
            echo "::warning::EXPO_PUBLIC_TMDB_API_KEY secret is empty. Franchise search will fall back to Arr-only lookup in this APK."
          else
            echo "✅ EXPO_PUBLIC_TMDB_API_KEY is set for this build"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Ensure Android SDK packages
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -1 || true)"
          if [ -z "${SDKMANAGER}" ]; then
            echo "::error::sdkmanager not found under ${ANDROID_HOME}/cmdline-tools"
            exit 1
          fi
          yes | "${SDKMANAGER}" --licenses >/dev/null || true
          "${SDKMANAGER}" --sdk_root="${ANDROID_HOME}" --install \
            "platform-tools" \
            "build-tools;36.1.0" \
            "platforms;android-35" \
            "platforms;android-36"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.2.0
        with:
          cache-read-only: false

      - name: Install dependencies
        run: npm ci

      - name: Generate Android app
        run: npx expo prebuild --platform android --clean

      - name: Tune Gradle for CI
        run: |
          set -euo pipefail
          PROPS=./android/gradle.properties
          touch "${PROPS}"
          if [ -s "${PROPS}" ] && [ -n "$(tail -c1 "${PROPS}")" ]; then
            printf '\n' >> "${PROPS}"
          fi
          grep -q '^org.gradle.caching=' "${PROPS}" || echo 'org.gradle.caching=true' >> "${PROPS}"
          grep -q '^org.gradle.parallel=' "${PROPS}" || echo 'org.gradle.parallel=true' >> "${PROPS}"
          grep -q '^org.gradle.jvmargs=' "${PROPS}" || echo 'org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8' >> "${PROPS}"

      - name: Build APK with Gradle
        working-directory: ./android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --build-cache --parallel

      - name: Package APK
        id: apk
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          APK_PATH="$(find ./android -name '*.apk' -type f | grep -i release | head -1 || true)"
          if [ -z "${APK_PATH}" ]; then
            echo "::error::No release APK found under ./android"
            exit 1
          fi
          APK_NAME="Arrmada-${VERSION}.apk"
          cp "${APK_PATH}" "${APK_NAME}"
          echo "apk_path=${APK_NAME}" >> "${GITHUB_OUTPUT}"
          echo "✅ Packaged ${APK_NAME} from ${APK_PATH}"

      - name: Upload APK to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          APK_PATH: ${{ steps.apk.outputs.apk_path }}
        run: |
          set -euo pipefail
          gh release upload "${TAG}" "${APK_PATH}" --clobber
          echo "✅ Published ${APK_PATH} on ${TAG}"

      - name: Summary
        run: |
          echo "✅ APK built and attached"
          echo "📦 Version: ${{ steps.version.outputs.version }}"
          echo "🏷️ Tag: ${{ steps.version.outputs.tag }}"
          echo "📱 APK: ${{ steps.apk.outputs.apk_path }}"
