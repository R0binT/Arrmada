name: Publish release

on:
  pull_request:
    types: [closed]
    branches: [master]

permissions:
  contents: write

concurrency:
  group: publish-release-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: >
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'release/v')
    runs-on: ubuntu-latest
    name: Build APK and publish GitHub Release
    steps:
      - name: Checkout merge commit
        uses: actions/checkout@v4

      - name: Resolve version from release branch
        id: version
        run: |
          set -euo pipefail
          BRANCH="${{ github.event.pull_request.head.ref }}"
          VERSION="${BRANCH#release/v}"
          if ! [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Cannot parse semver from branch '${BRANCH}'."
            exit 1
          fi
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "${PKG_VERSION}" != "${VERSION}" ]; then
            echo "::error::Branch version ${VERSION} does not match package.json ${PKG_VERSION}."
            exit 1
          fi
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "tag=v${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "✅ Version ${VERSION}"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install dependencies
        run: npm ci

      - name: Generate Android app
        run: npx expo prebuild --platform android --clean

      - name: Build APK with Gradle
        working-directory: ./android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease

      - name: Package APK
        id: apk
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          APK_PATH="$(find ./android -name '*.apk' -type f | grep -i release | head -1 || true)"
          if [ -z "${APK_PATH}" ]; then
            echo "::error::No release APK found under ./android"
            exit 1
          fi
          APK_NAME="Arrmada-${VERSION}.apk"
          cp "${APK_PATH}" "${APK_NAME}"
          echo "apk_path=${APK_NAME}" >> "${GITHUB_OUTPUT}"
          echo "✅ Packaged ${APK_NAME} from ${APK_PATH}"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          APK_PATH: ${{ steps.apk.outputs.apk_path }}
        run: |
          set -euo pipefail
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "ℹ️ Release ${TAG} already exists — uploading APK"
          else
            echo "📝 Creating release ${TAG}"
            gh release create "${TAG}" \
              --title "Arrmada ${VERSION}" \
              --generate-notes \
              --target "${{ github.sha }}"
          fi
          gh release upload "${TAG}" "${APK_PATH}" --clobber
          echo "✅ Published ${APK_PATH} on ${TAG}"

      - name: Summary
        run: |
          echo "✅ APK built and attached"
          echo "📦 Version: ${{ steps.version.outputs.version }}"
          echo "🏷️ Tag: ${{ steps.version.outputs.tag }}"
          echo "📱 APK: ${{ steps.apk.outputs.apk_path }}"
