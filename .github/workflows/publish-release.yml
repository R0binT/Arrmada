name: Publish release

on:
  pull_request:
    types: [closed]
    branches: [master]

permissions:
  contents: write

concurrency:
  group: publish-release-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: >
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'release/v')
    runs-on: ubuntu-latest
    name: Build APK and publish GitHub Release
    env:
      # GitHub-hosted Ubuntu image default.
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout merge commit
        uses: actions/checkout@v7

      - name: Resolve version from release branch
        id: version
        run: |
          set -euo pipefail
          BRANCH="${{ github.event.pull_request.head.ref }}"
          VERSION="${BRANCH#release/v}"
          if ! [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Cannot parse semver from branch '${BRANCH}'."
            exit 1
          fi
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "${PKG_VERSION}" != "${VERSION}" ]; then
            echo "::error::Branch version ${VERSION} does not match package.json ${PKG_VERSION}."
            exit 1
          fi
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "tag=v${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "✅ Version ${VERSION}"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      # Use the runner's preinstalled SDK. Do not reinstall cmdline-tools/emulator
      # or cache NDK — that cost ~12 min post-job per release with almost no gain.
      - name: Ensure Android SDK packages
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -1 || true)"
          if [ -z "${SDKMANAGER}" ]; then
            echo "::error::sdkmanager not found under ${ANDROID_HOME}/cmdline-tools"
            exit 1
          fi
          # Non-interactive license accept (runner image usually already licensed).
          yes | "${SDKMANAGER}" --licenses >/dev/null || true
          # build-tools must match app.json expo-build-properties.
          "${SDKMANAGER}" --sdk_root="${ANDROID_HOME}" --install \
            "platform-tools" \
            "build-tools;36.1.0" \
            "platforms;android-35" \
            "platforms;android-36"

      # PR-closed jobs are read-only for Gradle cache by default; allow write so
      # each successful release warms the cache for the next one.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Install dependencies
        run: npm ci

      - name: Generate Android app
        run: npx expo prebuild --platform android --clean

      - name: Tune Gradle for CI
        run: |
          set -euo pipefail
          PROPS=./android/gradle.properties
          touch "${PROPS}"
          grep -q '^org.gradle.caching=' "${PROPS}" || echo 'org.gradle.caching=true' >> "${PROPS}"
          grep -q '^org.gradle.parallel=' "${PROPS}" || echo 'org.gradle.parallel=true' >> "${PROPS}"
          grep -q '^org.gradle.jvmargs=' "${PROPS}" || echo 'org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8' >> "${PROPS}"

      - name: Build APK with Gradle
        working-directory: ./android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --build-cache --parallel

      - name: Package APK
        id: apk
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          APK_PATH="$(find ./android -name '*.apk' -type f | grep -i release | head -1 || true)"
          if [ -z "${APK_PATH}" ]; then
            echo "::error::No release APK found under ./android"
            exit 1
          fi
          APK_NAME="Arrmada-${VERSION}.apk"
          cp "${APK_PATH}" "${APK_NAME}"
          echo "apk_path=${APK_NAME}" >> "${GITHUB_OUTPUT}"
          echo "✅ Packaged ${APK_NAME} from ${APK_PATH}"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          APK_PATH: ${{ steps.apk.outputs.apk_path }}
        run: |
          set -euo pipefail
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "ℹ️ Release ${TAG} already exists — uploading APK"
          else
            echo "📝 Creating release ${TAG}"
            gh release create "${TAG}" \
              --title "Arrmada ${VERSION}" \
              --generate-notes \
              --target "${{ github.sha }}"
          fi
          gh release upload "${TAG}" "${APK_PATH}" --clobber
          echo "✅ Published ${APK_PATH} on ${TAG}"

      - name: Summary
        run: |
          echo "✅ APK built and attached"
          echo "📦 Version: ${{ steps.version.outputs.version }}"
          echo "🏷️ Tag: ${{ steps.version.outputs.tag }}"
          echo "📱 APK: ${{ steps.apk.outputs.apk_path }}"
